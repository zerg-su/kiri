[package]
name = "kiri-init"
description = "PID 1 and agent of the Kiri guest VM"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kiri-proto = { path = "../kiri-proto" }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
libc = "0.2"
ruzstd = "0.9"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seccompiler = "0.5.0"
syscalls = { version = "0.8.1", default-features = false, features = ["std", "all"] }

[lints]
workspace = true
